<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm thi thử</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dfe3ea;--pri:#1f5fbf;--ok:#1f8a4c;--bad:#c2372f;--hl:#fff3c4;--obs:#000;--ahl:#ffe94d;--ahlt:#1d2330;--head:#e7edf8}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2028;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2d3340;--pri:#6aa3ff;--ok:#4cc486;--bad:#ff7d75;--hl:#4a4220;--obs:#fff;--ahl:#d9b800;--ahlt:#14171d;--head:#262d3b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:150px;background:var(--card);border-right:1px solid var(--bd);padding:12px 8px;position:sticky;top:0;height:100vh}
nav b{display:block;padding:4px 10px 12px;font-size:15px}nav a{display:block;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--tx)}
nav a.on{background:var(--pri);color:#fff}main{flex:1;padding:16px;min-width:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px}h3{margin:12px 0 6px;font-size:14px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.d{color:var(--bad)}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px}label{color:var(--mut);font-size:12px;display:block;margin-bottom:2px}
.g{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.tw{overflow:auto;max-height:520px;border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);text-align:center}td:first-child,th:first-child{text-align:left}
tr.off td{color:var(--mut);text-decoration:line-through}tr.off td.k{text-decoration:none}
tr.abn td{background:rgba(224,138,0,.13)}td.abn2{background:rgba(194,55,47,.3)!important;font-weight:700}td.key,th.key{font-weight:700;background:var(--hl)}td.ok{color:var(--ok)}td.bad{color:var(--bad)}.mut{color:var(--mut)}
.ck{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;margin:2px;border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:12.5px;cursor:pointer;user-select:none}.ck.off{color:var(--mut);text-decoration:line-through;cursor:default}.tag{padding:1px 7px;border-radius:9px;background:var(--bd);font-size:11.5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
svg text{fill:var(--tx);font-size:11px}svg .ax{stroke:var(--mut)}svg .gr{stroke:var(--bd)}
/* ---- bảng đáp án theo đề gốc ---- */
.tw2{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
table.ans{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content}
.ans th,.ans td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);text-align:center;padding:0 4px;height:25px;min-width:34px;white-space:nowrap}
.ans td.stt,.ans th.stt{min-width:46px}
.ans th{background:var(--head);font-weight:700;position:sticky;z-index:2}
.ans tr.h1 th{top:0}.ans tr.h2 th{top:26px}
.ans .bs{border-left:2px solid var(--tx)}
.ans td.y{background:var(--ahl);color:var(--ahlt);font-weight:700}
.ans td.gc{cursor:pointer}.ans td.gc:hover{outline:2px solid var(--pri);outline-offset:-2px}.ans td.gc.no{cursor:default;opacity:.4}
.ans td.z{background:rgba(224,138,0,.25)}.ans td.m{background:rgba(194,55,47,.22)}
.ans .sk{position:sticky;background:var(--card);z-index:1}.ans th.sk{z-index:3;background:var(--head)}
.ans td.sk.y{background:var(--ahl)}
.c0{left:0}.c1{left:46px}.c2{left:80px}.c3{left:114px}.c4{left:148px}
.ans tr.sec td{border-bottom:2px solid var(--tx)}
.sw{display:inline-block;width:14px;height:14px;vertical-align:middle;border:1px solid var(--bd)}
.warn{padding:6px 8px;border-left:3px solid #e08a00;background:rgba(224,138,0,.12);margin:4px 0;font-size:12.5px;border-radius:0 6px 6px 0}
#tip{position:fixed;display:none;pointer-events:none;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:260px}
circle.pt{cursor:pointer}circle.pt:hover{stroke:var(--tx)!important;stroke-width:3!important}
#toast{position:fixed;right:14px;bottom:14px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:420px;z-index:9}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:r 1s linear infinite;vertical-align:middle}@keyframes r{to{transform:rotate(360deg)}}
/* ---- tab Đường cong ---- */
.cvw{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:980px){.cvw{grid-template-columns:minmax(0,1fr)}}
.cvl .cvt{max-height:calc(100vh - 250px)}.cvt td.k{white-space:nowrap}.cvt tr{cursor:pointer}.cvt tr.off{cursor:default}.cvt tr.sel td{background:rgba(31,95,191,.08)}
.cvt th.srt{cursor:pointer;user-select:none;white-space:nowrap}.cvt th.srt:hover,.cvt th.srt.on{color:var(--pri)}.cvt th .ar{font-size:9px;margin-left:3px;opacity:.45}.cvt th.on .ar{opacity:1}
.pus{display:inline-flex;align-items:center;gap:4px}.pu{min-width:30px;padding:3px 8px;font-weight:700;color:var(--mut);text-decoration:line-through}.pu.on{background:var(--pri);border-color:var(--pri);color:#fff;text-decoration:none}.pu:disabled{cursor:default;opacity:.55}.pu.on:disabled{opacity:.75}
.cvt .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px;vertical-align:middle}
.cvr{position:sticky;top:8px}.cvo{margin-bottom:10px;row-gap:6px}
.plotbox{background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden;min-height:200px}
.cvempty{display:flex;align-items:center;justify-content:center;aspect-ratio:8/5;color:#6b7385;font-size:14px}
.cva{display:grid;grid-template-columns:70px 2fr 1fr 1fr;gap:6px 8px;align-items:center;margin-top:10px}.cva label{margin:0;font-size:13px;color:var(--tx)}
.tg{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid var(--bd);border-radius:16px;margin:0 2px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none}
.tg input{display:none}.tg .tr{width:38px;height:20px;border-radius:10px;background:var(--pri);position:relative;flex:none}
.tg .tr:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg input:checked~.tr:after{left:21px}.tg input:not(:checked)~.l0,.tg input:checked~.l1{font-weight:700;color:var(--pri)}
</style></head><body>
<nav><b>Chấm thi thử</b><div id="tabs"></div></nav>
<main>
 <div class="bar"><span>Đợt thi</span><select id="dsSel"></select><span>Lần chạy IRT</span><select id="runSel"></select><span id="busy"></span></div>
 <div id="view"></div>
</main><div id="toast"></div><div id="tip"></div>
<script>
const $=s=>document.querySelector(s), SEC=[["TV","Tiếng Việt","#1f5fbf"],["TA","Tiếng Anh","#d62728"],["TO","Toán","#e08a00"],["KH","Tư duy khoa học","#2ca02c"]];
const S={ds:null,run:null,tab:"data",dsl:[],runs:[]};
const f2=(v,d=3)=>v==null?"":(typeof v=="number"?v.toFixed(d):v);
function toast(m,t=3500){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e.t);e.t=setTimeout(()=>e.style.display="none",t)}
async function api(u,o){$("#busy").innerHTML='<span class="sp"></span>';try{const r=await fetch(u,o);const j=await r.json();if(j.error)throw new Error(j.error);return j}catch(e){toast("Lỗi: "+e.message,7000);throw e}finally{$("#busy").innerHTML=""}}
const post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
function tbl(rows,cols,o={}){ // cols: [key,label,fmt?]
 return `<div class="tw"><table><tr>${cols.map(c=>`<th class="${o.keyCol&&o.keyCol(c[0])?'key':''}">${c[1]}</th>`).join("")}</tr>${rows.map(r=>`<tr class="${o.rowCls?o.rowCls(r):''}">${cols.map(c=>{const v=c[2]?c[2](r[c[0]],r):f2(r[c[0]]);const k=o.cellCls?o.cellCls(r,c[0]):"";return `<td class="${k}">${v??""}</td>`}).join("")}</tr>`).join("")}</table></div>`}
const need=(k)=>S[k]?true:(($("#view").innerHTML=`<div class="card mut">Hãy chọn ${k=="ds"?"một đợt thi ở tab <b>Dữ liệu</b>":"một lần chạy ở tab <b>IRT</b>"}.</div>`),false);

/* ---------- biểu đồ SVG ---------- */
function chart(o){const W=o.w||430,H=o.h||300,m={l:44,r:12,t:o.title?26:12,b:o.cats?80:36},pw=W-m.l-m.r,ph=H-m.t-m.b;
 const [x0,x1]=o.xl,[y0,y1]=o.yl,X=v=>m.l+(v-x0)/(x1-x0)*pw,Y=v=>m.t+ph-(v-y0)/(y1-y0)*ph;let s="";
 const tk=(a,b,n)=>{const st=(b-a)/n;return Array.from({length:n+1},(_,i)=>a+i*st)};
 (o.cats?[]:tk(x0,x1,o.nx||6)).forEach(v=>s+=`<line class="gr" x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t+ph}"/><text x="${X(v)}" y="${H-m.b+14}" text-anchor="middle">${+v.toFixed(2)}</text>`);
 if(o.cats)o.cats.forEach((t,i)=>s+=`<text transform="translate(${X(i+.5)+4} ${H-m.b+12}) rotate(-35)" text-anchor="end" style="font-size:10px">${t}</text>`);
 tk(y0,y1,o.ny||5).forEach(v=>s+=`<line class="gr" y1="${Y(v)}" y2="${Y(v)}" x1="${m.l}" x2="${m.l+pw}"/><text x="${m.l-5}" y="${Y(v)+4}" text-anchor="end">${+v.toFixed(2)}</text>`);
 s+=`<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="none" class="ax"/>`;
 (o.bars||[]).forEach(b=>{const bw=Math.max(1,(X(b.x+b.w)-X(b.x))-1);s+=`<rect x="${X(b.x)}" y="${Y(b.y)}" width="${bw}" height="${Math.max(0,Y(y0)-Y(b.y))}" fill="${b.c||'#1f5fbf'}" opacity=".8"/>`;if(o.cnt&&b.y>0)s+=`<text x="${X(b.x)+bw/2}" y="${Y(b.y)-2}" text-anchor="middle" style="font-size:9px">${b.y}</text>`});
 (o.series||[]).forEach(se=>{const pts=se.x.map((x,i)=>[X(x),Y(se.y[i])]).filter(p=>isFinite(p[0])&&isFinite(p[1]));
  if(se.pts)s+=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:${se.c}"/>`).join("");
  if(se.line!==false)s+=`<polyline fill="none" style="stroke:${se.c}" stroke-width="${se.pts?1:2}" ${se.dash?'stroke-dasharray="6 4"':''} points="${pts.map(p=>p.join(",")).join(" ")}"/>`});
 if(o.title)s+=`<text x="${W/2}" y="16" text-anchor="middle" style="font-size:13px;font-weight:600">${o.title}</text>`;
 s+=`<text x="${m.l+pw/2}" y="${H-3}" text-anchor="middle">${o.xlab||""}</text><text transform="translate(11 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${o.ylab||""}</text>`;
 let lg="",ly=m.t+12;(o.series||[]).filter(se=>se.label).forEach(se=>{lg+=`<line x1="${m.l+8}" x2="${m.l+28}" y1="${ly-4}" y2="${ly-4}" style="stroke:${se.c}" stroke-width="2" ${se.dash?'stroke-dasharray="6 4"':''}/><text x="${m.l+32}" y="${ly}">${se.label}</text>`;ly+=14});
 (o.notes||[]).forEach(t=>{lg+=`<text x="${m.l+8}" y="${ly}" class="mut">${t}</text>`;ly+=13});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}${lg}</svg>`}
function hist(vals,lo,hi,n,c){const w=(hi-lo)/n,cnt=Array(n).fill(0);vals.filter(isFinite).forEach(v=>{let i=Math.floor((v-lo)/w);if(i>=0&&i<=n)cnt[Math.min(i,n-1)]++});return{bars:cnt.map((y,i)=>({x:lo+i*w,w,y,c})),max:Math.max(...cnt,1)}}
function histChart(vals,lo,hi,n,c,title,xlab){const h=hist(vals,lo,hi,n,c);return chart({title,xl:[lo,hi],yl:[0,Math.ceil(h.max*1.12)],bars:h.bars,cnt:1,xlab,ylab:"Số lượng"})}

/* ---------- điều hướng ---------- */
const TABS=[["data","Dữ liệu"],["score","Chấm điểm"],["ctt","CTT"],["irt","IRT"],["true","Điểm thực"],["noise","Nhiễu"],["icc","Đường cong"],["link","Neo đề"]];
$("#tabs").innerHTML=TABS.map(t=>`<a data-t="${t[0]}">${t[1]}</a>`).join("");
$("#tabs").onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;go()}};
function go(){document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t==S.tab));V[S.tab]()}
async function loadDs(){S.dsl=await api("/api/datasets");if(!S.dsl.find(d=>d.id==S.ds))S.ds=S.dsl[0]?.id||null;$("#dsSel").innerHTML=S.dsl.map(d=>`<option value="${d.id}" ${d.id==S.ds?"selected":""}>#${d.id} ${d.name} (${d.n} TS)</option>`).join("");await loadRuns()}
async function loadRuns(){S.runs=S.ds?await api("/api/runs/"+S.ds):[];if(!S.runs.find(r=>r.id==S.run))S.run=S.runs[0]?.id||null;
 $("#runSel").innerHTML=`<option value="">— chưa có —</option>`+S.runs.map(r=>`<option value="${r.id}" ${r.id==S.run?"selected":""}>#${r.id} ${r.name}</option>`).join("")}
$("#dsSel").onchange=async e=>{S.ds=+e.target.value;S.run=null;await loadRuns();go()};
$("#runSel").onchange=e=>{S.run=+e.target.value||null;go()};
const runData=async()=>S.run?await api("/api/run/"+S.run):null;

const V={};
/* ---------- Dữ liệu ---------- */
V.data=()=>{$("#view").innerHTML=`<div class="card"><h2>Tải dữ liệu và chấm</h2><div class="g g2">
 <div><label>Tên đợt</label><input id="dn" placeholder="Đợt 1 - 2027" style="width:100%"></div>
 <div><label>File bài làm (.csv)</label><input type="file" id="fd" accept=".csv"></div>
 <div><label>File mapping (.csv, dấu ;)</label><input type="file" id="fm" accept=".csv"></div>
 <div><label>File SBD→MaDe (tuỳ chọn)</label><input type="file" id="fx" accept=".csv"></div></div>
 <p class="row"><button class="p" id="go">Chấm điểm</button><span class="mut">Chạy cham_diem.py: đổi bài làm về đề gốc, chấm 1/0/−1.</span></p><pre id="lg" class="mut"></pre></div>
 <div class="card"><h2>Các đợt đã lưu</h2>${tbl(S.dsl,[["id","#"],["name","Tên",v=>v],["ts","Thời gian",v=>v],["n","Số TS",v=>v],["id","",(v)=>`<button data-u="${v}">Chọn</button> <button class="d" data-x="${v}">Xoá</button>`]])}</div><div class="card" id="ansCard"></div>`;
 $("#go").onclick=async()=>{const fd=new FormData();fd.append("name",$("#dn").value);fd.append("data",$("#fd").files[0]);fd.append("mapping",$("#fm").files[0]);if($("#fx").files[0])fd.append("made",$("#fx").files[0]);
  if(!$("#fd").files[0]||!$("#fm").files[0])return toast("Chọn file bài làm và mapping");const j=await api("/api/dataset",{method:"POST",body:fd});$("#lg").textContent=j.log;S.ds=j.id;await loadDs();toast("Đã chấm xong")};
 $("#view").onclick=async e=>{if(e.target.dataset.u){S.ds=+e.target.dataset.u;await loadDs();V.data()}if(e.target.dataset.x&&confirm("Xoá đợt này và các lần chạy IRT?")){await api("/api/dataset/"+e.target.dataset.x,{method:"DELETE"});S.ds=null;await loadDs();V.data()}}};

/* ---------- Bảng đáp án theo mã đề (cuối tab Dữ liệu) ---------- */
const AL="ABCD";S.map=null;S.dirty={};
const mkSet=q=>new Set((S.map.marks[q-1]||"").split("").filter(Boolean));
const mcls=q=>{const n=mkSet(q).size;return n==0?"z":n>1?"m":""};
async function loadAns(){const box=$("#ansCard");if(!box)return;
 if(!S.ds){box.innerHTML='<h2>Bảng đáp án theo mã đề</h2><span class="mut">Chọn một đợt thi ở bảng phía trên.</span>';return}
 try{S.map=await api("/api/mapping/"+S.ds);drawAns()}catch(e){box.innerHTML=`<h2>Bảng đáp án theo mã đề</h2><span class="bad">Không đọc được mapping: ${e.message}</span>`}}
function drawAns(){const m=S.map,E=m.exams,box=$("#ansCard");if(!box)return;
 let h=`<h2>Bảng đáp án theo mã đề — đề gốc, ${m.n} câu</h2><div class="row"><button class="p" id="rg">Chấm lại</button><span id="dty" class="tag" style="display:${S.dirty[S.ds]?"inline":"none"}">Đã chỉnh đáp án, chưa chấm lại</span></div>
 <p class="mut" style="margin:8px 0"><span class="sw" style="background:var(--ahl)"></span> đáp án đúng · bấm ô trong khối <b>Gốc</b> để đánh dấu / bỏ đánh dấu, các mã đề sao đổi theo ·
 <span class="sw" style="background:rgba(224,138,0,.4)"></span> STT: chưa có đáp án đúng (mọi thí sinh được điểm) · <span class="sw" style="background:rgba(194,55,47,.35)"></span> STT: nhiều đáp án đúng.
 Sau khi chỉnh, bấm <b>Chấm lại</b>; các lần chạy IRT cũ vẫn dùng đáp án trước đó nên cần chạy lại IRT.</p>${m.warnings.map(w=>`<div class="warn">${w}</div>`).join("")}
 <div class="tw2"><table class="ans" id="tb"><thead><tr class="h1"><th colspan="5" class="sk c0">Gốc</th>${E.map(e=>`<th colspan="5" class="bs">${e.code}</th>`).join("")}</tr>
 <tr class="h2">${["STT",...AL].map((t,i)=>`<th class="sk c${i} ${i?"":"stt"}">${t}</th>`).join("")}${E.map(()=>["STT",...AL].map((t,i)=>`<th class="${i?"":"stt bs"}">${t}</th>`).join("")).join("")}</tr></thead><tbody>`;
 for(let q=1;q<=m.n;q++){const ms=mkSet(q),ok=m.valid[q-1];
  h+=`<tr data-r="${q}" class="${q%30==0?"sec":""}"><td class="sk c0 stt ${ok?mcls(q):""}" title="Câu gốc ${q}">${q}</td>`+[0,1,2,3].map(i=>`<td class="sk c${i+1} gc ${ok?"":"no"} ${ms.has(AL[i])?"y":""}" data-q="${q}" data-l="${AL[i]}"></td>`).join("");
  E.forEach((e,k)=>{const x=e.map[q-1];if(!x){h+=`<td class="stt bs mut">—</td><td></td><td></td><td></td><td></td>`;return}
   h+=`<td class="stt bs">${x[0]}</td>`+[0,1,2,3].map(p=>`<td class="${ms.has(x[1][p])?"y":""}" data-e="${k}" data-p="${p}" title="gốc: ${x[1][p]}"></td>`).join("")});
  h+="</tr>"}
 box.innerHTML=h+"</tbody></table></div>";
 $("#tb").onclick=async e=>{const t=e.target;if(!t.classList.contains("gc")||t.classList.contains("no"))return;const q=+t.dataset.q,l=t.dataset.l,ms=mkSet(q);
  ms.has(l)?ms.delete(l):ms.add(l);const sv=[...ms].sort().join("");S.map.marks[q-1]=sv;paintAns(q);S.dirty[S.ds]=true;$("#dty").style.display="inline";
  try{await post(`/api/mapping/${S.ds}/marks`,{q,marks:sv})}catch(_){loadAns()}};
 $("#rg").onclick=async()=>{toast("Đang chấm lại…",30000);const j=await api(`/api/dataset/${S.ds}/regrade`,{method:"POST"});S.dirty[S.ds]=false;await loadDs();toast(`Đã chấm lại ${j.n} thí sinh theo đáp án đã chỉnh. Hãy chạy lại IRT nếu cần.`,8000);V.data()}}
function paintAns(q){const ms=mkSet(q),tr=$(`tr[data-r="${q}"]`);
 tr.querySelectorAll("td.gc").forEach(c=>c.classList.toggle("y",ms.has(c.dataset.l)));
